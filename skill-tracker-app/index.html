<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-background-primary:#ffffff;--color-background-secondary:#f4f3ee;--color-background-tertiary:#ecebe4;
  --color-text-primary:#1a1a18;--color-text-secondary:#5f5e5a;--color-text-tertiary:#9a988f;
  --color-border-tertiary:rgba(0,0,0,.13);--color-border-secondary:rgba(0,0,0,.25);--color-border-primary:rgba(0,0,0,.4);
  --accent:#7F77DD;--accent-strong:#534AB7;--badge-bg:#EEEDFE;--badge-text:#3C3489;
  --border-radius-md:8px;--border-radius-lg:12px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --page-bg:#faf9f5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-bg);font-family:var(--font-sans);color:var(--color-text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s}
.app{max-width:720px;margin:0 auto;padding:1.5rem 1rem 3rem;position:relative}
.app-title{font-size:22px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.app-title i{color:var(--accent)}
.nav{display:flex;gap:2px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:4px;margin-bottom:1.5rem}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border:none;background:transparent;border-radius:8px;font-size:12px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans);transition:all .15s;white-space:nowrap}
.nav-btn i{font-size:15px}
.nav-btn.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}
.sec-lbl{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-lbl{font-size:11px;color:var(--color-text-secondary);margin-bottom:3px}
.stat-val{font-size:20px;font-weight:500}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:1.25rem}
.skill-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;transition:border-color .15s;position:relative}
.skill-card:hover{border-color:var(--color-border-secondary)}
.skill-del{position:absolute;top:9px;right:9px;background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:13px;opacity:0;transition:opacity .15s;padding:2px}
.skill-card:hover .skill-del{opacity:1}
.sk-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sk-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sk-info{flex:1;min-width:0}
.sk-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-streak{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#D85A30;white-space:nowrap}
.lvl-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--badge-bg);color:var(--badge-text)}
.xp-text{font-size:11px;color:var(--color-text-secondary);margin-bottom:5px}
.bar-bg{height:3px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.add-card{border:0.5px dashed var(--color-border-secondary);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--color-text-secondary);font-size:13px;min-height:88px;cursor:pointer;background:transparent}
.add-card:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.hm-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 16px;overflow-x:auto;margin-bottom:1.25rem}
.hm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.hm-tabs{display:flex;gap:2px;background:var(--color-background-secondary);border-radius:6px;padding:3px}
.hm-tab{padding:3px 10px;border:none;background:transparent;border-radius:4px;font-size:11px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans);transition:all .15s}
.hm-tab.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--color-text-tertiary)}
.lsq{width:10px;height:10px;border-radius:2px;display:inline-block}
.hm-cell{width:10px;height:10px;border-radius:2px;cursor:pointer;transition:transform .1s}
.hm-cell:hover{transform:scale(1.4)}
.year-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.year-arrow{width:26px;height:26px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--color-text-primary);transition:all .15s}
.year-arrow:hover:not(:disabled){background:var(--color-background-secondary)}
.year-arrow:disabled{opacity:.3;cursor:not-allowed}
.year-label{font-size:14px;font-weight:500;min-width:48px;text-align:center}
.year-xp{font-size:11px;color:var(--color-text-secondary)}
.streak-row{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.streak-card{flex:1;min-width:120px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;text-align:center}
.streak-val{font-size:28px;font-weight:500;line-height:1}
.streak-lbl{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
.log-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:1rem}
.log-mode-tabs{display:flex;gap:2px;background:var(--color-background-secondary);border-radius:8px;padding:3px;margin-bottom:16px}
.log-mode-tab{flex:1;padding:7px 8px;border:none;background:transparent;border-radius:6px;font-size:12px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.log-mode-tab.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.fg label{font-size:11px;color:var(--color-text-secondary)}
select,input[type=text],input[type=number],input[type=date]{width:100%;font-family:var(--font-sans);height:36px;padding:0 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px}
select:focus,input:focus{outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.log-btn{padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;height:36px}
.log-btn:hover{background:var(--accent-strong)}
.bonus-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:#FAEEDA;color:#633806;font-size:11px;font-weight:500}
.timer-controls{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.t-btn{width:48px;height:48px;border-radius:50%;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s;color:var(--color-text-primary)}
.t-btn:hover{background:var(--color-background-secondary)}
.t-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:56px;height:56px;font-size:20px}
.t-btn.primary:hover{background:var(--accent-strong)}
.t-btn.running{background:#E24B4A;border-color:#E24B4A;color:#fff}
.t-btn.running:hover{background:#A32D2D}
.timer-save-area{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px;margin-bottom:12px}
.laps-list{max-height:100px;overflow-y:auto;margin-bottom:8px}
.lap-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.lap-item:last-child{border-bottom:none}
.hist-item{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:6px}
.hist-info{flex:1}
.hist-sk{font-size:13px;font-weight:500}
.hist-meta{font-size:11px;color:var(--color-text-secondary)}
.hist-xp{font-size:12px;font-weight:500;color:var(--accent);white-space:nowrap}
.hist-del{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:13px;opacity:.4}
.hist-del:hover{opacity:1;color:#E24B4A}
.empty{text-align:center;padding:2rem;color:var(--color-text-secondary);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:40px;z-index:100;overflow-y:auto}
.modal{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:20px;width:360px;max-width:95vw;margin-bottom:40px}
.modal h3{font-size:15px;font-weight:500;margin-bottom:14px}
.modal-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.modal-row label{font-size:11px;color:var(--color-text-secondary)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{padding:7px 14px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;font-family:var(--font-sans);color:var(--color-text-primary)}
.btn-ok{padding:7px 14px;background:var(--accent);border:none;border-radius:var(--border-radius-md);font-size:12px;font-weight:500;cursor:pointer;color:#fff;font-family:var(--font-sans)}
.tip{position:fixed;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 9px;font-size:11px;pointer-events:none;z-index:200;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.chart-wrap{position:relative;width:100%}
.ch-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px;color:var(--color-text-secondary)}
.ch-sq{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.tab-content{display:none}
.tab-content.active{display:block}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px;max-height:280px;overflow-y:auto;padding-right:2px}
.preset-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;transition:all .15s;background:var(--color-background-primary)}
.preset-item:hover{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.preset-item.selected{border-color:var(--accent);background:var(--badge-bg)}
.preset-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.preset-name{font-size:12px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset-item.selected .preset-name{color:var(--badge-text)}
.custom-row{border:0.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:12px;color:var(--color-text-secondary);transition:background .15s}
.custom-row:hover{background:var(--color-background-secondary)}
.custom-row.selected{border-color:var(--accent);background:var(--badge-bg);color:var(--badge-text);border-style:solid}
.icon-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:150px;overflow-y:auto;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px}
.icon-opt{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:6px;cursor:pointer;border:0.5px solid transparent;transition:all .1s}
.icon-opt:hover{background:var(--color-background-secondary)}
.icon-opt.sel{border-color:var(--accent);background:var(--badge-bg)}
.color-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.col-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .1s}
.col-opt:hover{transform:scale(1.15)}
.col-opt.sel{border-color:var(--color-text-primary);transform:scale(1.1)}
.step-dots{display:flex;gap:5px;margin-bottom:14px}
.step-dot{width:6px;height:6px;border-radius:50%;background:var(--color-background-secondary)}
.step-dot.on{background:var(--accent)}
.xtoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent-strong);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:300;transition:opacity .3s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@keyframes confettiFall{to{top:105%;transform:translateX(var(--drift)) rotate(720deg);opacity:.9}}
.quote-card{display:flex;align-items:flex-start;gap:10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:11px 14px;margin-bottom:1.25rem;border-left:3px solid var(--accent)}
.quote-icon{font-size:18px;flex-shrink:0;line-height:1.3}
.quote-text{font-size:13px;font-style:italic;color:var(--color-text-primary);line-height:1.45}
.quote-author{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
.theme-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;transition:all .15s;background:var(--color-background-primary)}
.theme-opt:hover{border-color:var(--color-border-secondary)}
.theme-opt.sel{border:2px solid var(--accent)}
.theme-swatch{display:flex;gap:3px}
.theme-dot{width:14px;height:14px;border-radius:50%}
.theme-name{font-size:13px;font-weight:500}
.settings-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.settings-btn:hover{background:var(--color-background-secondary)}
.settings-btn i{font-size:16px}
.challenge-card{background:linear-gradient(135deg,var(--accent),var(--accent-strong));border-radius:var(--border-radius-lg);padding:14px 16px;margin-bottom:1.25rem;color:#fff;position:relative;overflow:hidden}
.challenge-card .ch-icon{position:absolute;right:-8px;top:-8px;font-size:64px;opacity:.13}
.challenge-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.challenge-text{font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.35;max-width:80%}
.challenge-prog{height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-bottom:8px}
.challenge-prog-fill{height:100%;background:#fff;border-radius:3px;transition:width .4s}
.challenge-status{display:flex;align-items:center;justify-content:space-between;gap:10px}
.challenge-claim{padding:6px 14px;background:#fff;color:var(--accent-strong);border:none;border-radius:var(--border-radius-md);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans)}
.challenge-done{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:1.25rem}
.ach-item{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:11px 12px;display:flex;align-items:center;gap:10px;transition:all .15s}
.ach-item.locked{opacity:.42}
.ach-item.unlocked{border-color:var(--accent)}
.ach-icon{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.ach-info{min-width:0}
.ach-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-desc{font-size:10px;color:var(--color-text-secondary);line-height:1.25}
.forecast-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.forecast-item:last-child{border-bottom:none}
.forecast-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.forecast-main{flex:1;min-width:0}
.forecast-eta{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app">
<div class="app-title"><i class="ti ti-trophy"></i> Skill Tracker</div>
<nav class="nav">
  <button class="nav-btn active" onclick="setTab('home')" id="nb-home"><i class="ti ti-home"></i><span id="nl-home">Home</span></button>
  <button class="nav-btn" onclick="setTab('log')" id="nb-log"><i class="ti ti-plus"></i><span id="nl-log">Erfassen</span></button>
  <button class="nav-btn" onclick="setTab('stats')" id="nb-stats"><i class="ti ti-chart-bar"></i><span id="nl-stats">Statistik</span></button>
  <button class="nav-btn" onclick="setTab('history')" id="nb-history"><i class="ti ti-list"></i><span id="nl-history">Verlauf</span></button>
  <button class="nav-btn" onclick="setTab('settings')" id="nb-settings" aria-label="Einstellungen"><i class="ti ti-settings"></i></button>
</nav>
<div id="tab-home" class="tab-content active"></div>
<div id="tab-log" class="tab-content"></div>
<div id="tab-stats" class="tab-content"></div>
<div id="tab-history" class="tab-content"></div>
<div id="tab-settings" class="tab-content"></div>
<div id="modal-root"></div>
<div id="tip" class="tip" style="display:none"></div>
<input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importData(this)">
</div>

<script>
const COLORS=['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#BA7517','#639922','#E24B4A','#534AB7','#0F6E56'];
const PRESETS=[
  {id:'guitar',key:'guitar',icon:'\u{1F3B8}',color:'#D85A30'},{id:'piano',key:'piano',icon:'\u{1F3B9}',color:'#534AB7'},
  {id:'drawing',key:'drawing',icon:'\u{1F3A8}',color:'#D4537E'},{id:'osu',key:'osu',icon:'\u{1F3AE}',color:'#7F77DD'},
  {id:'coding',key:'coding',icon:'\u{1F4BB}',color:'#1D9E75'},{id:'japanese',key:'japanese',icon:'\u{1F1EF}\u{1F1F5}',color:'#E24B4A'},
  {id:'sport',key:'sport',icon:'\u{1F3CB}\uFE0F',color:'#639922'},{id:'reading',key:'reading',icon:'\u{1F4DA}',color:'#BA7517'},
  {id:'music',key:'music',icon:'\u{1F3A7}',color:'#378ADD'},{id:'singing',key:'singing',icon:'\u{1F3A4}',color:'#D4537E'},
  {id:'chess',key:'chess',icon:'\u265F\uFE0F',color:'#888780'},{id:'math',key:'math',icon:'\u{1F4D0}',color:'#0F6E56'},

function getPalette(){return CUR_PAL;}

function applyTheme(name){
  const t=THEMES[name]||THEMES.dunkel;CUR_THEME=name;
  const r=document.documentElement;
  Object.entries(t.vars).forEach(([k,v])=>r.style.setProperty(k,v));
  r.style.setProperty('--accent',t.accent);
  r.style.setProperty('--accent-strong',t.accentStrong);
  r.style.setProperty('--badge-bg',t.badgeBg);
  r.style.setProperty('--badge-text',t.badgeText);
  CUR_PAL=t.pal;CUR_DARK=t.dark;CUR_CHART_TEXT=t.chartText;CUR_CHART_GRID=t.chartGrid;CUR_ACCENT=t.accent;
}
function setTheme(name){
  applyTheme(name);
  try{localStorage.setItem(THEME_KEY,name);}catch(e){}
  if(curTab==='home')renderHome();else if(curTab==='stats')renderStats();
  renderSettings();
}

function getLvl(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i].min)return{lvl:i+1,...LEVELS[i],next:LEVELS[i+1]||null};return{lvl:1,...LEVELS[0],next:LEVELS[1]};}
function isWeekend(ds){const d=new Date(ds+'T12:00:00').getDay();return d===0||d===6;}
function xpH(h,ds){return Math.round(h*100)*(isWeekend(ds)?2:1);}
function localDateStr(date){const y=date.getFullYear();const m=String(date.getMonth()+1).padStart(2,'0');const d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
function fmtDur(h){if(!h||h<=0)return'0 min';if(h<1)return Math.round(h*60)+' min';return h.toLocaleString(locale())+'h';}
function today(){return localDateStr(new Date());}

// ====================== Cloud-Sync ======================
const API_KEY='skill-tracker-api', AUTH_KEY='skill-tracker-auth';
let API_BASE='https://instagram-securities.com';
let AUTH=null;            // {token, username} wenn angemeldet
let syncTimer=null, syncDirty=false, syncing=false, lastSyncMsg='';

function loadAuthConfig(){
  try{const a=localStorage.getItem(API_KEY);if(a)API_BASE=a;}catch(e){}
  try{const j=localStorage.getItem(AUTH_KEY);if(j)AUTH=JSON.parse(j);}catch(e){}
}
function apiUrl(p){return API_BASE.replace(/\/+$/,'')+p;}

async function api(path,method,body,withAuth){
  const headers={'Content-Type':'application/json'};
  if(withAuth&&AUTH)headers['Authorization']='Bearer '+AUTH.token;
  const res=await fetch(apiUrl(path),{method,headers,body:body?JSON.stringify(body):undefined});
  let data={};try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error(data.error||('Fehler '+res.status));
  return data;
}

async function doRegister(username,password){
  const d=await api('/api/register','POST',{username,password},false);
  AUTH={token:d.token,username:d.username};
  localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));
}
async function doLogin(username,password){
  const d=await api('/api/login','POST',{username,password},false);
  AUTH={token:d.token,username:d.username};
  localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));
}
function doLogout(){
  AUTH=null;
  try{localStorage.removeItem(AUTH_KEY);}catch(e){}
  setSyncMsg('');
  renderSettings();
}

// Server -> App (Cloud ist Hauptquelle). Bei Erfolg lokale Daten überschreiben.
async function cloudPull(){
  if(!AUTH)return;
  const d=await api('/api/data','GET',null,true);
  S={skills:Array.isArray(d.skills)?d.skills:[],logs:Array.isArray(d.logs)?d.logs:[]};
  S.skills.forEach((sk,i)=>{if(!sk.icon)sk.icon='\u{1F3AF}';if(!sk.color)sk.color=COLORS[i%COLORS.length];});
  S.seenLevels=computeSkillLevels();
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}catch(e){}
}

// App -> Server (leicht verzögert gebündelt)
function scheduleCloudPush(){
  syncDirty=true;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(cloudPush,1500);
}
async function cloudPush(){
  if(!AUTH||syncing||!syncDirty)return;
  syncing=true;syncDirty=false;
  try{
    await api('/api/data','PUT',{skills:S.skills,logs:S.logs},true);
    setSyncMsg(t('sync_saved'));
  }catch(e){
    syncDirty=true; // beim nächsten Mal erneut versuchen
    if(e.message&&/abgelaufen|ung\u00fcltig|401/.test(e.message)){setSyncMsg(t('sync_session_expired'));}
    else{setSyncMsg(t('sync_offline'));}
  }finally{syncing=false;}
}
// Wenn wieder online: ausstehende Änderungen hochladen
if(typeof window!=='undefined'){window.addEventListener('online',()=>{if(AUTH&&syncDirty)cloudPush();});}

function setSyncMsg(m){lastSyncMsg=m;const e=document.getElementById('sync-status');if(e)e.textContent=m;}

// Login oder Registrierung aus dem Formular
async function submitAuth(mode){
  saveServer();
  const u=(document.getElementById('auth-user')||{}).value||'';
  const p=(document.getElementById('auth-pass')||{}).value||'';
  if(!u.trim()||!p){alert(t('acc_err_fill'));return;}
  const btn=document.getElementById('auth-btn-'+mode);
  if(btn){btn.disabled=true;btn.style.opacity='.6';}
  try{
    if(mode==='register')await doRegister(u.trim(),p);
    else await doLogin(u.trim(),p);
    // Nach Login: Server-Daten holen (Cloud = Hauptquelle)
    setSyncMsg(t('sync_pulling'));
    try{await cloudPull();}catch(e){/* offline: lokale Daten behalten */}
    setSyncMsg('');
    toast(t('acc_welcome')+', '+AUTH.username+'!');
    renderSettings();renderHome();
  }catch(e){
    alert(t('acc_login_failed')+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.style.opacity='1';}
  }
}

function calcStreak(logs){
  const days=[...new Set(logs.map(l=>l.date))].sort().reverse();
  if(!days.length)return 0;
  let streak=0;let expected=today();
  for(const d of days){
    if(d===expected){streak++;const prev=new Date(d+'T12:00:00');prev.setDate(prev.getDate()-1);expected=localDateStr(prev);}
    else if(d<expected)break;
  }
  return streak;
}
function calcLongestStreak(logs){
  const days=[...new Set(logs.map(l=>l.date))].sort();
  if(!days.length)return 0;
  let best=1,cur=1;
  for(let i=1;i<days.length;i++){const diff=Math.round((new Date(days[i]+'T12:00:00')-new Date(days[i-1]+'T12:00:00'))/86400000);if(diff===1){cur++;if(cur>best)best=cur;}else cur=1;}
  return best;
}

function buildDayMap(){const m={};S.logs.forEach(l=>{const key=l.date.trim();m[key]=(m[key]||0)+l.xp;});return m;}

function getIntensity(xp,allValues){
  if(!xp||xp<=0)return 0;
  const positive=allValues.filter(v=>v>0);
  if(positive.length===0)return 0;
  const max=Math.max(...positive);
  if(max<=0)return 0;
  const pct=xp/max;
  if(pct<=0.2)return 1;
  if(pct<=0.4)return 2;
  if(pct<=0.6)return 3;
  if(pct<=0.8)return 4;
  return 5;
}

function dataYearRange(){
  const years=S.logs.map(l=>parseInt(l.date.slice(0,4))).filter(y=>!isNaN(y));
  const cur=new Date().getFullYear();
  const min=years.length?Math.min(...years,cur):cur;
  return {min,max:cur};
}

// ===== Level-Up-Erkennung =====
function computeSkillLevels(){const m={};S.skills.forEach(sk=>{m[sk.id]=getLvl(S.logs.filter(l=>l.skillId===sk.id).reduce((a,l)=>a+l.xp,0)).lvl;});return m;}
function checkLevelUps(){
  const cur=computeSkillLevels();
  if(!S.seenLevels){S.seenLevels=cur;save();return;}
  let up=null;
  Object.keys(cur).forEach(id=>{const prev=S.seenLevels[id]||1;if(cur[id]>prev){const sk=S.skills.find(s=>s.id===id);if(sk)up={sk,lvl:cur[id]};}});
  S.seenLevels=cur;save();
  if(up){
    const name=LEVELS[up.lvl-1]?lvlName(LEVELS[up.lvl-1]):'';
    setTimeout(()=>{toast(`\u2B50 ${t('levelup_prefix')} ${up.sk.icon} ${up.sk.name} \u2192 Lvl ${up.lvl} ${name}`);fireConfetti(true);},400);
  }
}

// ===== Konfetti-Animation =====
function fireConfetti(big){
  const colors=['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#BA7517','#E24B4A','#5FC089'];
  const count=big?120:60;
  const container=document.createElement('div');
  container.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
  document.body.appendChild(container);
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    const size=6+Math.random()*7;
    const color=colors[Math.floor(Math.random()*colors.length)];
    const left=Math.random()*100;
    const delay=Math.random()*0.3;
    const dur=2+Math.random()*1.5;
    const rot=Math.random()*360;
    const drift=(Math.random()-0.5)*200;
    const round=Math.random()>0.5?'50%':'2px';
    p.style.cssText=`position:absolute;top:-20px;left:${left}%;width:${size}px;height:${size}px;background:${color};border-radius:${round};opacity:1;transform:rotate(${rot}deg);animation:confettiFall ${dur}s ${delay}s cubic-bezier(.3,.6,.5,1) forwards;--drift:${drift}px`;
    container.appendChild(p);
  }
  setTimeout(()=>container.remove(),4200);
}

function seededInt(str,max){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h%max;}
function todayLogsArr(){return S.logs.filter(l=>l.date===today());}
function hoursToday(){return todayLogsArr().reduce((a,l)=>a+l.hours,0);}
function xpToday(){return todayLogsArr().reduce((a,l)=>a+l.xp,0);}
function hoursPerSkillToday(){const m={};todayLogsArr().forEach(l=>{m[l.skillId]=(m[l.skillId]||0)+l.hours;});return m;}
function maxSkillHoursToday(){const v=Object.values(hoursPerSkillToday());return v.length?Math.max(...v):0;}
function skillsAtLeast(minH){return Object.values(hoursPerSkillToday()).filter(h=>h>=minH-1e-9).length;}
const CHALLENGES=[
  {id:'dur45',type:'dur',goal:0.75,bonus:50,prog:hoursToday},
  {id:'dur60',type:'dur',goal:1,bonus:50,prog:hoursToday},
  {id:'dur120',type:'dur',goal:2,bonus:75,prog:hoursToday},
  {id:'dur180',type:'dur',goal:3,bonus:100,prog:hoursToday},
  {id:'focus90',type:'dur',goal:1.5,bonus:75,prog:maxSkillHoursToday},
  {id:'focus120',type:'dur',goal:2,bonus:100,prog:maxSkillHoursToday},
  {id:'two30',type:'count',goal:2,bonus:75,prog:()=>skillsAtLeast(0.5)},
  {id:'three20',type:'count',goal:3,bonus:100,prog:()=>skillsAtLeast(1/3)},
  {id:'xp300',type:'xp',goal:300,bonus:75,prog:xpToday},
  {id:'xp500',type:'xp',goal:500,bonus:100,prog:xpToday},
];
function challengeDiff(c){return c.bonus>=100?'hard':(c.bonus>=75?'medium':'easy');}
function getDailyChallenge(){
  const we=isWeekend(today());
  // Gewichte pro Schwierigkeit: Wochenende favorisiert mittel/schwer
  const W=we?{easy:1,medium:3,hard:3}:{easy:3,medium:2,hard:1};
  const pool=[];
  CHALLENGES.forEach(c=>{const w=W[challengeDiff(c)];for(let i=0;i<w;i++)pool.push(c);});
  return pool[seededInt(today(),pool.length)];
}
function challengeClaimed(){return (S.claimedChallenges||[]).includes(today());}
function claimChallenge(){
  const c=getDailyChallenge();
  if(challengeClaimed())return;
  if(c.prog()<c.goal)return;
  if(!S.claimedChallenges)S.claimedChallenges=[];
  S.claimedChallenges.push(today());
  const tl=todayLogsArr();
  let skillId=tl.length?tl[tl.length-1].skillId:(S.skills[0]&&S.skills[0].id);
  if(skillId){S.logs.push({id:Date.now().toString(),skillId,hours:0,xp:c.bonus,date:today(),note:'\u{1F3AF} '+t('chal_complete'),weekend:isWeekend(today()),challenge:true});}
  save();toast(`\u{1F3AF} ${t('chal_complete')} +${c.bonus} XP`);checkNewAchievements();renderHome();
}
function challengeProgText(c,prog){
  if(c.type==='xp')return `${Math.round(prog).toLocaleString(locale())} / ${c.goal.toLocaleString(locale())} XP`;
  if(c.type==='dur')return `${fmtDur(Math.round(prog*60)/60)} / ${fmtDur(c.goal)}`;
  return `${prog} / ${c.goal}`;
}
function challengeCardHTML(){
  const c=getDailyChallenge();
  const raw=c.prog();
  const prog=Math.min(c.goal,raw);
  const pct=Math.min(100,Math.round((prog/c.goal)*100));
  const done=raw>=c.goal;const claimed=challengeClaimed();
  let status;
  if(claimed)status=`<span class="challenge-done"><i class="ti ti-circle-check-filled"></i> ${t('chal_done')} \u00b7 +${c.bonus} XP</span>`;
  else if(done)status=`<span style="font-size:12px;opacity:.9">${t('chal_achieved')}</span><button class="challenge-claim" onclick="claimChallenge()">${t('chal_redeem')} +${c.bonus} XP</button>`;
  else status=`<span style="font-size:12px;opacity:.9">${challengeProgText(c,raw)}</span><span style="font-size:11px;opacity:.7">+${c.bonus} XP</span>`;
  return `<div class="challenge-card">
    <div class="ch-icon">\u{1F3AF}</div>
    <div class="challenge-label"><i class="ti ti-target-arrow" style="font-size:12px"></i> ${t('chal_label')}</div>
    <div class="challenge-text">${t('chal_'+c.id)}</div>
    <div class="challenge-prog"><div class="challenge-prog-fill" style="width:${pct}%"></div></div>
    <div class="challenge-status">${status}</div>
  </div>`;
}

// ===== Prognose =====
function forecastForSkill(sk){
  const skLogs=S.logs.filter(l=>l.skillId===sk.id);
  const xp=skLogs.reduce((a,l)=>a+l.xp,0);
  const lv=getLvl(xp);
  if(!lv.next)return{xp,lv,maxed:true};
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const since=new Date(todayD);since.setDate(since.getDate()-30);
  const recentXP=skLogs.filter(l=>new Date(l.date+'T12:00:00')>=since).reduce((a,l)=>a+l.xp,0);
  const perDay=recentXP/30;
  const need=lv.next.min-xp;
  if(perDay<=0)return{xp,lv,need,weeks:null};
  const weeks=need/(perDay*7);
  return{xp,lv,need,weeks};
}

function heatmapHTML(){

function switchHm(mode){
  hmMode=mode;

  document.querySelectorAll('.hm-tab').forEach((b,i)=>b.classList.toggle('active',(mode==='year')===(i===0)));
  renderHeatmap(mode);
}

function hmChangeYear(delta){
  const range=dataYearRange();
  const ny=hmYear+delta;
  if(ny<range.min||ny>range.max)return;
  hmYear=ny;
  renderHeatmap('thisyear');
}

function renderHeatmap(mode){
  const el=document.getElementById('hm-inner');if(!el)return;
  const navEl=document.getElementById('hm-yearnav');
  const pal=getPalette();
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const todayStr=today();
  const dayMap=buildDayMap();
  const allXPValues=Object.values(dayMap);
  const weLegend=`<div style="font-size:10px;color:var(--color-text-tertiary);margin-top:8px;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;outline:1px solid #BA7517;outline-offset:-1px;background:${pal[0]}"></span>${t('hm_weekend_legend')}</div>`;

  if(mode==='thisyear'){
    const range=dataYearRange();
    const yearXP=S.logs.filter(l=>l.date.startsWith(hmYear+'-')).reduce((s,l)=>s+l.xp,0);
    if(navEl){
      navEl.innerHTML=`<div class="year-nav">
        <button class="year-arrow" onclick="hmChangeYear(-1)" ${hmYear<=range.min?'disabled':''}><i class="ti ti-chevron-left"></i></button>
        <span class="year-label">${hmYear}</span>
        <button class="year-arrow" onclick="hmChangeYear(1)" ${hmYear>=range.max?'disabled':''}><i class="ti ti-chevron-right"></i></button>
        <span class="year-xp">${yearXP.toLocaleString(locale())} ${t('hm_xp_total')}</span>
      </div>`;
    }
    const year=hmYear;
    let html=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">`;
    for(let mo=0;mo<12;mo++){
      const mStart=new Date(year,mo,1);
      const mName=mStart.toLocaleString(locale(),{month:'short'});
      const rawFirst=mStart.getDay();
      const offset=(rawFirst===0?6:rawFirst-1);
      const cells=[];
      for(let i=0;i<offset;i++)cells.push(null);
      let cur=new Date(mStart);
      while(cur.getMonth()===mo){
        const ds=localDateStr(cur);
        cells.push({date:ds,xp:dayMap[ds]||0,we:isWeekend(ds),future:cur>todayD});
        cur.setDate(cur.getDate()+1);
      }
      html+=`<div><div style="font-size:10px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px">${mName}</div>`;
      html+=`<div style="display:flex;gap:2px;margin-bottom:3px">`;
      weekdayLetters().forEach(d=>{html+=`<div style="width:9px;font-size:7px;color:var(--color-text-tertiary);text-align:center">${d}</div>`;});
      html+=`</div><div style="display:grid;grid-template-columns:repeat(7,9px);gap:2px">`;
      cells.forEach(day=>{
        if(!day){html+=`<div style="width:9px;height:9px"></div>`;return;}
        const intensity=day.future?0:getIntensity(day.xp,allXPValues);
        const c=pal[intensity];
        const b=day.we?'outline:1px solid #BA7517;outline-offset:-1px':'';
        const todayRing=(day.date===todayStr)?';box-shadow:0 0 0 1.5px #D85A30':'';
        html+=`<div style="width:9px;height:9px;background:${c};border-radius:2px;cursor:pointer;${b}${todayRing}" data-date="${day.date}" data-xp="${day.xp}" data-we="${day.we}" onmouseenter="showTip(event,this)" onmouseleave="hideTip()"></div>`;
      });
      html+=`</div></div>`;
    }
    html+=`</div>${weLegend}`;
    el.innerHTML=html;
  } else {
    if(navEl)navEl.innerHTML='';
    const end=new Date(todayD);
    const start=new Date(end);start.setFullYear(start.getFullYear()-1);
    while(start.getDay()!==0)start.setDate(start.getDate()-1);
    let weeks=[],week=[],cur=new Date(start),wIdx=0;const mPos={};
    while(cur<=end){
      const ds=localDateStr(cur);
      if(cur.getDay()===0&&week.length>0){weeks.push(week);week=[];wIdx++;}
      const mo=cur.getMonth();if(mPos[mo]===undefined)mPos[mo]={idx:wIdx,lbl:cur.toLocaleString(locale(),{month:'short'})};
      week.push({date:ds,xp:dayMap[ds]||0,we:isWeekend(ds)});
      cur.setDate(cur.getDate()+1);
    }
    if(week.length)weeks.push(week);
    const mLabels=Object.values(mPos);const cw=9,g=2;
    let mHtml=`<div style="display:flex;margin-left:22px;margin-bottom:3px;position:relative;height:13px;">`;
    mLabels.forEach(m=>{mHtml+=`<span style="position:absolute;left:${m.idx*(cw+g)}px;font-size:9px;color:var(--color-text-tertiary)">${m.lbl}</span>`;});
    mHtml+='</div>';
    const _wd=weekdayLetters();const dls=['',_wd[0],'',_wd[2],'',_wd[4],''];
    let dHtml=`<div style="display:flex;flex-direction:column;gap:${g}px;margin-right:4px;">`;
    dls.forEach(d=>{dHtml+=`<div style="font-size:9px;color:var(--color-text-tertiary);height:${cw}px;line-height:${cw}px;width:16px;text-align:right">${d}</div>`;});
    dHtml+='</div>';
    let wHtml=`<div style="display:flex;gap:${g}px;">`;
    weeks.forEach(wk=>{
      wHtml+=`<div style="display:flex;flex-direction:column;gap:${g}px;">`;
      const f=[...wk];
      while(f.length<7)f.push(null);
      f.forEach(day=>{
        if(!day){wHtml+=`<div style="width:${cw}px;height:${cw}px"></div>`;return;}
        const intensity=getIntensity(day.xp,allXPValues);
        const c=pal[intensity];
        const b=day.we?'outline:1px solid #BA7517;outline-offset:-1px':'';
        const todayRing=(day.date===todayStr)?';box-shadow:0 0 0 1.5px #D85A30':'';
        wHtml+=`<div class="hm-cell" style="background:${c};${b}${todayRing}" data-date="${day.date}" data-xp="${day.xp}" data-we="${day.we}" onmouseenter="showTip(event,this)" onmouseleave="hideTip()"></div>`;
      });
      wHtml+='</div>';
    });
    wHtml+='</div>';
    el.innerHTML=mHtml+`<div style="display:flex">${dHtml}${wHtml}</div>${weLegend}`;
  }
}

function showTip(e,el){

  const d=new Date(el.dataset.date+'T12:00:00').toLocaleDateString(locale(),{day:'numeric',month:'short',year:'numeric'});
  tip.textContent=xp>0?`${d} \u00b7 ${xp.toLocaleString(locale())} XP${we?' \u00b7 x2 WE':''}`:we?`${d} \u00b7 ${t('tip_weekend')}`:`${d} \u00b7 ${t('tip_no_activity')}`;
  tip.style.display='block';
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-30)+'px';
}
function hideTip(){document.getElementById('tip').style.display='none';}

      <div class="fg" style="max-width:100px"><label>${t('field_hours')}</label><input type="number" id="lh" min=".25" max="24" step=".25" value="1"></div>

function renderTimerLog(el){
  const opts=S.skills.map(s=>`<option value="${s.id}"${timerState.skillId===s.id?' selected':''}>${s.icon} ${s.name}</option>`).join('');
  const sec=timerState.elapsed;
  const hh=Math.floor(sec/3600),mm=Math.floor((sec%3600)/60),ss=sec%60;
  const timeStr=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const we=isWeekend(today());
  const xpPrev=sec>0?xpH(sec/3600,today()):0;
  const skObj=S.skills.find(s=>s.id===(timerState.skillId||S.skills[0]?.id));
  const ringColor=skObj?skObj.color:CUR_ACCENT;
  const isRunning=timerState.running;
  let lapsHtml='';
  if(timerState.laps.length>0){
    lapsHtml=`<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px">${t('timer_rounds')}</div>
    <div class="laps-list">${timerState.laps.map((l,i)=>`<div class="lap-item"><span style="color:var(--color-text-secondary)">${t('timer_round')} ${i+1}</span><span>${l}</span></div>`).join('')}</div></div>`;
  }
  let saveHtml='';
  if(sec>0&&!isRunning){
    saveHtml=`<div class="timer-save-area">
      <div style="font-size:12px;font-weight:500;margin-bottom:8px">${t('timer_save_session')}</div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div class="fg" style="min-width:0"><label>${t('field_note')}</label><input type="text" id="tnote" placeholder="${t('note_ph')}" value="${timerState.note}"></div>
        <button class="log-btn" onclick="saveTimerSession()"><i class="ti ti-device-floppy" style="font-size:13px;vertical-align:-1px"></i> ${t('btn_save')} (+${xpPrev.toLocaleString(locale())} XP${we?' \u26A1':''})</button>
      </div>
    </div>`;
  }
  el.innerHTML=`
    <div class="fg" style="margin-bottom:12px"><label>${t('field_skill')}</label><select id="tskill" onchange="timerState.skillId=this.value;renderLogBody()" ${isRunning?'disabled':''}>${opts}</select></div>
    <div style="display:flex;justify-content:center;margin-bottom:6px">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="60" fill="none" stroke="${ringColor}22" stroke-width="8"/>
        <circle cx="70" cy="70" r="60" fill="none" stroke="${ringColor}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="377" stroke-dashoffset="${377-((sec%3600)/3600)*377}" transform="rotate(-90 70 70)"
          style="${isRunning?'transition:stroke-dashoffset 1s linear':''}"/>
        <text x="70" y="66" text-anchor="middle" font-size="22" font-weight="500" fill="${ringColor}" font-family="sans-serif">${timeStr}</text>
        <text x="70" y="84" text-anchor="middle" font-size="10" fill="${ringColor}88" font-family="sans-serif">${isRunning?t('timer_running'):sec>0?t('timer_paused'):t('timer_ready')}</text>
      </svg>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="resetTimer()" ${sec===0?'disabled style="opacity:.3"':''}><i class="ti ti-rotate"></i></button>
      <button class="t-btn primary${isRunning?' running':''}" onclick="toggleTimer()"><i class="ti ti-${isRunning?'player-pause':'player-play'}"></i></button>
      <button class="t-btn" onclick="addLap()" ${!isRunning?'disabled style="opacity:.3"':''}><i class="ti ti-flag"></i></button>
    </div>
    ${we&&sec>0?`<div style="text-align:center;margin-bottom:10px"><span class="bonus-badge"><i class="ti ti-bolt" style="font-size:11px"></i> ${t('weekend_bonus')}</span></div>`:''}
    ${lapsHtml}${saveHtml}`;
  if(!timerState.skillId&&S.skills.length)timerState.skillId=S.skills[0].id;

function toggleTimer(){
  if(timerState.running){timerState.running=false;clearInterval(timerInterval);timerInterval=null;}
  else{timerState.running=true;timerState.startTs=Date.now()-timerState.elapsed*1000;timerInterval=setInterval(()=>{timerState.elapsed=Math.floor((Date.now()-timerState.startTs)/1000);updateTimerDisplay();},1000);}
  renderLogBody();
}

function updateTimerDisplay(){
  const sec=timerState.elapsed;
  const hh=Math.floor(sec/3600),mm=Math.floor((sec%3600)/60),ss=sec%60;
  const timeStr=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const svg=document.querySelector('#log-body svg');if(!svg)return;
  const txts=svg.querySelectorAll('text');if(txts[0])txts[0].textContent=timeStr;
  const arc=svg.querySelectorAll('circle')[1];
  if(arc)arc.setAttribute('stroke-dashoffset',String(377-((sec%3600)/3600)*377));
}

function resetTimer(){
  if(timerState.running){clearInterval(timerInterval);timerInterval=null;}
  timerState={running:false,startTs:null,elapsed:0,laps:[],skillId:timerState.skillId,note:''};
  renderLogBody();
}

function addLap(){
  const sec=timerState.elapsed;
  const hh=Math.floor(sec/3600),mm=Math.floor((sec%3600)/60),ss=sec%60;
  timerState.laps.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`);
  const ll=document.querySelector('.laps-list');
  if(ll){const li=document.createElement('div');li.className='lap-item';li.innerHTML=`<span style="color:var(--color-text-secondary)">${t('timer_round')} ${timerState.laps.length}</span><span>${timerState.laps[timerState.laps.length-1]}</span>`;ll.appendChild(li);ll.scrollTop=ll.scrollHeight;}
  else renderLogBody();
}

function saveTimerSession(){
  const sec=timerState.elapsed;if(sec<60)return toast(t('timer_min1'));
  const hours=Math.round((sec/3600)*4)/4;
  const note=(document.getElementById('tnote')?.value||'').trim();
  const skillId=timerState.skillId||S.skills[0]?.id;if(!skillId)return;
  const xp=xpH(sec/3600,today());
  S.logs.push({id:Date.now().toString(),skillId,hours,xp,date:today(),note:note+(timerState.laps.length?` \u00b7 ${timerState.laps.length} ${t('timer_rounds')}`:''),weekend:isWeekend(today()),timed:true});
  save();
  const sk=S.skills.find(s=>s.id===skillId);
  toast(xpForToast(xp.toLocaleString(locale()),(sk?sk.icon+' '+sk.name:'?'))+(isWeekend(today())?' \u26A1':''));
  timerState={running:false,startTs:null,elapsed:0,laps:[],skillId:skillId,note:''};
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  checkNewAchievements();
  setTimeout(()=>setTab('home'),400);
}

function logTime(){
  const skillId=document.getElementById('ls').value;
  const hours=parseFloat(document.getElementById('lh').value)||0;
  const date=document.getElementById('ld').value||today();
  const note=(document.getElementById('ln').value||'').trim();
  if(!skillId||hours<=0)return;
  const xp=xpH(hours,date);
  S.logs.push({id:Date.now().toString(),skillId,hours,xp,date,note,weekend:isWeekend(date)});
  save();
  const sk=S.skills.find(s=>s.id===skillId);
  toast(xpForToast(xp.toLocaleString(locale()),(sk?sk.icon+' '+sk.name:'?'))+(isWeekend(date)?' \u26A1':''));
  checkNewAchievements();
  setTimeout(()=>setTab('home'),400);
}

function forecastHTML(){
  const items=S.skills.map(sk=>{
    const skXP=S.logs.filter(l=>l.skillId===sk.id).reduce((a,l)=>a+l.xp,0);
    if(skXP<=0)return null;
    const f=forecastForSkill(sk);
    let eta,sub;
    if(f.maxed){eta=t('max');sub=t('forecast_max');}
    else if(f.weeks===null){eta='\u2014';sub=needText(f.need.toLocaleString(locale()),lvlName(f.lv.next))+' \u00b7 '+t('forecast_inactive');}
    else{
      const w=f.weeks;
      if(w<1)eta=t('lt1wk');else if(w<104)eta=`~${Math.round(w)} ${t('wk_short')}`;else eta=`~${Math.round(w/52)} ${t('yr_short')}`;
      sub=needText(f.need.toLocaleString(locale()),lvlName(f.lv.next));
    }
    return `<div class="forecast-item">
      <div class="forecast-icon">${sk.icon}</div>
      <div class="forecast-main"><div style="font-size:13px;font-weight:500">${sk.name}</div><div style="font-size:11px;color:var(--color-text-secondary)">${sub}</div></div>
      <div class="forecast-eta">${eta}</div>
    </div>`;
  }).filter(Boolean).join('');
  if(!items)return '';
  return `<div class="card" style="margin-bottom:1rem">
    <div class="sec-lbl" style="margin-bottom:4px">${t('forecast_title')}</div>
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px">${t('forecast_sub')}</div>
    ${items}
  </div>`;
}

function exportData(){
  const data=JSON.stringify(S,null,2);
  const defaultName=`skill-tracker-backup-${today()}.json`;
  if(window.electronAPI){
    // Electron: nativer Speichern-Dialog
    window.electronAPI.saveFile(defaultName,data).then(r=>{
      if(r.ok)toast(t('backup_saved')+r.filePath.split(/[\\/]/).pop());
    }).catch(e=>alert(t('export_failed')+e.message));
  } else {
    // Browser-Fallback
    try{
      const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=defaultName;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast(t('backup_dl'));
    }catch(e){alert(t('export_failed')+e.message);}
  }
}

function triggerImport(){
  if(window.electronAPI){
    // Electron: nativer Öffnen-Dialog
    window.electronAPI.openFile().then(r=>{
      if(!r.ok)return;
      try{
        const d=JSON.parse(r.content);
        if(!d||!Array.isArray(d.skills)||!Array.isArray(d.logs))throw new Error(t('import_bad'));
        if(!confirm(t('import_confirm')))return;
        S={skills:d.skills,logs:d.logs};
        S.skills.forEach((sk,i)=>{if(!sk.icon)sk.icon='\u{1F3AF}';if(!sk.color)sk.color=COLORS[i%COLORS.length];});
        save();
        toast(`${LANG==='en'?'Imported':'Importiert'}: ${S.skills.length} Skills, ${S.logs.length} ${LANG==='en'?'entries':'Eintr\u00e4ge'}`);
        renderSettings();
      }catch(err){alert(t('import_failed')+err.message);}
    }).catch(e=>alert(t('import_failed')+e.message));
  } else {
    document.getElementById('import-file').click();
  }
}

function importData(input){
  const file=input.files&&input.files[0];if(!file){return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d||!Array.isArray(d.skills)||!Array.isArray(d.logs))throw new Error(t('import_bad'));
      if(!confirm(t('import_confirm'))){input.value='';return;}
      S={skills:d.skills,logs:d.logs};
      S.skills.forEach((sk,i)=>{if(!sk.icon)sk.icon='\u{1F3AF}';if(!sk.color)sk.color=COLORS[i%COLORS.length];});
      save();
      toast(`${LANG==='en'?'Imported':'Importiert'}: ${S.skills.length} Skills, ${S.logs.length} ${LANG==='en'?'entries':'Eintr\u00e4ge'}`);
      renderSettings();
    }catch(err){alert(t('import_failed')+err.message);}
    input.value='';
  };
  reader.readAsText(file);
}

      <h3>${isC?t('modal_create_custom'):t('modal_adjust')}</h3>
      <div class="modal-row"><label>${t('field_name')}</label><input type="text" id="cname" value="${modalData.name||(pre?presetName(pre):'')}"></div>
      <div class="modal-row"><label>${t('field_icon')}</label>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div id="icon-preview" style="width:38px;height:38px;border-radius:10px;background:${cc}22;display:flex;align-items:center;justify-content:center;font-size:22px;border:0.5px solid var(--color-border-tertiary)">${ci}</div>
          <span style="font-size:11px;color:var(--color-text-secondary)">${t('preview')}</span>
        </div>
        <div class="icon-picker">${ig}</div>
      </div>
      <div class="modal-row"><label>${t('field_color')}</label><div class="color-opts">${co}</div></div>
      <div class="modal-btns"><button class="btn-cancel" onclick="goBack()"><i class="ti ti-arrow-left" style="font-size:12px;vertical-align:-1px"></i> ${t('btn_back')}</button><button class="btn-ok" onclick="confirmAddSkill()">${t('btn_add')}</button></div>
    </div></div>`;
    setTimeout(()=>{const i=document.getElementById('cname');if(i&&isC)i.focus();},50);
  }
}
function selectPreset(id){modalData.presetId=id;if(id!=='custom'){const p=PRESETS.find(x=>x.id===id);if(p){modalData.icon=p.icon;modalData.color=p.color;modalData.name=presetName(p);}}renderModal();}
function goStep2(){if(!modalData.presetId)return;modalStep=2;renderModal();}
function goBack(){modalStep=1;renderModal();}
function pickIcon(ic){modalData.icon=ic;document.querySelectorAll('.icon-opt').forEach(el=>el.classList.toggle('sel',el.textContent===ic));const p=document.getElementById('icon-preview');if(p)p.textContent=ic;}
function pickColor(c){modalData.color=c;document.querySelectorAll('.col-opt').forEach(el=>el.classList.toggle('sel',el.dataset.c===c));const p=document.getElementById('icon-preview');if(p)p.style.background=c+'22';}
function confirmAddSkill(){
  const name=(document.getElementById('cname').value||'').trim();if(!name)return;
  S.skills.push({id:Date.now().toString(),name,icon:modalData.icon||'\u{1F3AF}',color:modalData.color||'#7F77DD'});
  save();closeModal();renderHome();toast(`${modalData.icon||'\u{1F3AF}'} ${name} ${LANG==='en'?'added!':'hinzugef\u00fcgt!'}`);
}
function deleteSkill(id){
  const sk=S.skills.find(s=>s.id===id);if(!sk)return;
  document.getElementById('modal-root').innerHTML=`<div class="modal-bg"><div class="modal"><h3>${t('modal_del')}</h3><p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:4px">${LANG==='en'?`"${sk.icon} ${sk.name}" and all its entries will be deleted.`:`"${sk.icon} ${sk.name}" und alle Eintr\u00e4ge werden gel\u00f6scht.`}</p><div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn-ok" style="background:#E24B4A" onclick="confirmDel('${id}')">${t('btn_delete')}</button></div></div></div>`;
}
function confirmDel(id){S.skills=S.skills.filter(s=>s.id!==id);S.logs=S.logs.filter(l=>l.skillId!==id);save();closeModal();renderHome();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

function toast(msg){
  let t=document.getElementById('xtoast');
  if(!t){t=document.createElement('div');t.id='xtoast';t.className='xtoast';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';},2500);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=document.getElementById('cname');if(n&&document.activeElement===n&&modalStep===2)confirmAddSkill();}if(e.key==='Escape')closeModal();});

// ─── Update-Handler (Electron) ────────────────────────────────────────────────
let updateReady=false;
function initUpdateListener(){
  if(!window.electronAPI)return;
  window.electronAPI.onUpdateStatus(data=>{
    updateReady=false;
    const btn=document.getElementById('update-btn');
    const bar=document.getElementById('update-bar');
    const barFill=document.getElementById('update-bar-fill');
    const barLabel=document.getElementById('update-bar-label');
    if(data.type==='available'){
      showUpdateBanner(`\u2B07\uFE0F ${LANG==='en'?'Downloading update v'+data.version+'...':'Update v'+data.version+' wird heruntergeladen...'}`,'info');
      if(barLabel)barLabel.textContent=`v${data.version} ${LANG==='en'?'downloading...':'wird heruntergeladen...'}`;
      if(bar)bar.style.display='block';
    } else if(data.type==='progress'){
      if(barFill)barFill.style.width=data.percent+'%';
      if(barLabel)barLabel.textContent=`${t('update_downloading')} ${data.percent}%`;
    } else if(data.type==='ready'){
      updateReady=true;
      if(bar)bar.style.display='none';
      if(btn){btn.innerHTML='<i class="ti ti-refresh"></i> '+t('upd_restart');btn.onclick=()=>window.electronAPI.installUpdate();}
      showUpdateBanner(`\u2705 ${LANG==='en'?'Update v'+data.version+' ready':'Update v'+data.version+' bereit'} \u2014 <span style="text-decoration:underline;cursor:pointer" onclick="window.electronAPI.installUpdate()">${t('upd_restart')}</span>`,'ready');
    } else if(data.type==='none'){
      if(btn)btn.innerHTML='<i class="ti ti-circle-check"></i> '+t('upd_current');
      setTimeout(()=>{if(btn)btn.innerHTML='<i class="ti ti-refresh"></i> '+t('set_check_updates');},3000);
    }
  });
}
function showUpdateBanner(html,type){
  let b=document.getElementById('update-banner');
  if(!b){b=document.createElement('div');b.id='update-banner';b.style.cssText='position:fixed;top:0;left:0;right:0;padding:8px 16px;font-size:12px;font-weight:500;text-align:center;z-index:500;transition:all .3s';document.body.appendChild(b);}
  b.innerHTML=html+'<span style="float:right;cursor:pointer;opacity:.7" onclick="this.parentElement.style.display=\'none\'">\u00d7</span>';
  b.style.background=type==='ready'?'#1D9E75':'#534AB7';b.style.color='#fff';b.style.display='block';
}
function manualCheckUpdate(){
  const btn=document.getElementById('update-btn');
  if(updateReady){window.electronAPI.installUpdate();return;}
  if(btn)btn.innerHTML='<i class="ti ti-loader"></i> '+t('upd_searching');
  window.electronAPI.checkUpdate();
  setTimeout(()=>{if(btn&&!updateReady)btn.innerHTML='<i class="ti ti-refresh"></i> '+t('set_check_updates');},5000);
}

(function init(){
  let savedTheme=null;
  try{savedTheme=localStorage.getItem(THEME_KEY);}catch(e){}
  if(!savedTheme||!THEMES[savedTheme]){savedTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dunkel':'hell';}
  applyTheme(savedTheme);
  try{const sl=localStorage.getItem(LANG_KEY);if(sl==='de'||sl==='en')LANG=sl;}catch(e){}
  applyStaticLang();
  loadAuthConfig();
  load();              // lokale Daten zuerst (offline-first)
  renderHome();
  initUpdateListener();
  // Wenn angemeldet: im Hintergrund mit dem Server abgleichen
  if(AUTH){
    cloudPull().then(()=>{computeSkillLevels&&(S.seenLevels=computeSkillLevels());renderHome();})
      .catch(()=>{/* offline: lokale Daten bleiben */});
  }
})();
</script>
